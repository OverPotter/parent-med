<!doctype html>
<html lang="en" data-theme="light" style="background: #ebe4ff">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@500;600;700;800&family=Onest:wght@400;500;600;700;800&display=swap"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#ebe4ff" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="PillPath" />
    <script>
      (() => {
        const defaultTheme = "system";
        const lightBg = "#ebe4ff";
        const darkBg = "#1e1b2e";
        const storageKey = "pillpath-app";
        let themeMode = defaultTheme;
        let language = null;

        const parseLanguageTag = (tag) => {
          if (!tag || typeof tag !== "string") {
            return null;
          }

          const normalized = tag.trim().toLowerCase();
          if (!normalized) {
            return null;
          }

          return normalized.startsWith("ru") ? "ru" : "en";
        };

        try {
          const raw = localStorage.getItem(storageKey);
          if (raw) {
            const parsed = JSON.parse(raw);
            if (
              parsed?.state?.theme === "dark" ||
              parsed?.state?.theme === "light" ||
              parsed?.state?.theme === "system"
            ) {
              themeMode = parsed.state.theme;
            }
            if (parsed?.state?.language === "ru" || parsed?.state?.language === "en") {
              language = parsed.state.language;
            }
          }
        } catch {
          themeMode = defaultTheme;
        }

        if (language !== "ru" && language !== "en") {
          const preferredLanguages = Array.isArray(navigator.languages)
            ? navigator.languages
            : [navigator.language];
          for (const tag of preferredLanguages) {
            const parsedLanguage = parseLanguageTag(tag);
            if (parsedLanguage) {
              language = parsedLanguage;
              break;
            }
          }
        }
        if (language !== "ru" && language !== "en") {
          language = "en";
        }

        const resolvedTheme =
          themeMode === "system"
            ? window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light"
            : themeMode;
        const bg = resolvedTheme === "dark" ? darkBg : lightBg;
        document.documentElement.lang = language;
        document.documentElement.setAttribute("data-theme", resolvedTheme);
        document.documentElement.setAttribute("data-theme-mode", themeMode);
        document.documentElement.style.background = bg;
        document.documentElement.style.colorScheme = resolvedTheme;
        document.addEventListener(
          "DOMContentLoaded",
          () => {
            document.body.style.colorScheme = resolvedTheme;
            document.body.style.background = bg;
          },
          { once: true }
        );
        const themeMeta = document.querySelector('meta[name="theme-color"]');
        if (themeMeta) {
          themeMeta.setAttribute("content", bg);
        }
        const statusBarMeta = document.querySelector(
          'meta[name="apple-mobile-web-app-status-bar-style"]'
        );
        if (statusBarMeta) {
          statusBarMeta.setAttribute(
            "content",
            resolvedTheme === "dark" ? "black-translucent" : "default"
          );
        }
      })();
    </script>
    <title>PillPath</title>
    <style>
      #initial-boot-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        overflow: hidden;
        background:
          radial-gradient(circle at 10% 50%, rgba(138, 123, 191, 0.18), transparent 22%),
          radial-gradient(circle at 90% 50%, rgba(138, 123, 191, 0.16), transparent 22%),
          radial-gradient(circle at top left, rgba(166, 149, 207, 0.18), transparent 34%),
          linear-gradient(180deg, #f3efff 0%, #efe9ff 44%, #e8e1ff 100%);
        opacity: 1;
        visibility: visible;
        transition:
          opacity 260ms ease,
          visibility 260ms ease;
      }

      html[data-theme="dark"] #initial-boot-splash {
        background:
          radial-gradient(circle at 10% 50%, rgba(138, 123, 191, 0.16), transparent 24%),
          radial-gradient(circle at 90% 50%, rgba(138, 123, 191, 0.18), transparent 24%),
          linear-gradient(180deg, #26203a 0%, #1e1b2e 42%, #181427 100%);
      }

      #initial-boot-splash.is-closing {
        opacity: 0;
        visibility: hidden;
      }

      #initial-boot-splash__content {
        display: flex;
        min-height: 100vh;
        min-height: 100dvh;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1rem;
        padding: max(2rem, env(safe-area-inset-top)) 1.5rem max(2rem, env(safe-area-inset-bottom));
      }

      #initial-boot-splash__logo {
        width: 5.9rem;
        height: 5.9rem;
        object-fit: contain;
        filter: drop-shadow(0 18px 28px rgba(93, 77, 152, 0.16));
        animation: initial-boot-logo 3600ms cubic-bezier(0.4, 0.08, 0.2, 0.96) infinite;
      }

      #initial-boot-splash__wordmark {
        font-family: "Sora", "Manrope", "Plus Jakarta Sans", "Onest", "Segoe UI", sans-serif;
        font-size: clamp(2.2rem, 6vw, 3rem);
        font-weight: 800;
        letter-spacing: -0.06em;
        line-height: 1;
        white-space: nowrap;
        animation: initial-boot-wordmark 3600ms cubic-bezier(0.4, 0.08, 0.2, 0.96) infinite;
      }

      #initial-boot-splash__wordmark-pill {
        color: #4e4a61;
      }

      #initial-boot-splash__wordmark-path {
        background: linear-gradient(145deg, #f08ab8 0%, #cc7fd3 34%, #8a7bbf 68%, #6b4fd3 100%);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }

      @keyframes initial-boot-wordmark {
        0%,
        100% {
          transform: translate3d(0, 0, 0);
          opacity: 0.985;
        }
        50% {
          transform: translate3d(0, -1px, 0);
          opacity: 1;
        }
      }

      @keyframes initial-boot-logo {
        0%,
        100% {
          transform: translate3d(0, 0, 0) scale(1);
        }
        50% {
          transform: translate3d(0, -1px, 0) scale(1.008);
        }
      }
    </style>
    <script>
      (() => {
        window.__PM_BOOT_READY = false;
        const removeSplash = () => {
          const splash = document.getElementById("initial-boot-splash");
          if (!splash || splash.classList.contains("is-closing")) return;
          window.__PM_BOOT_READY = true;
          splash.classList.add("is-closing");
          window.setTimeout(() => splash.remove(), 320);
        };

        window.addEventListener("app:boot-ready", removeSplash, { once: true });
      })();
    </script>
  </head>
  <body style="margin: 0; background: #ebe4ff">
    <div id="initial-boot-splash" aria-hidden="true">
      <div id="initial-boot-splash__content">
        <img id="initial-boot-splash__logo" src="/pwa-icon.png" alt="" />
        <div id="initial-boot-splash__wordmark">
          <span id="initial-boot-splash__wordmark-pill">Pill</span
          ><span id="initial-boot-splash__wordmark-path">Path</span>
        </div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

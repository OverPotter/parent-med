name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  # ========== Backend ==========
  backend:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: parent_med_test
          POSTGRES_USER: parent_med_user
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "backend/uv.lock"

      - name: Install dependencies
        working-directory: backend
        run: uv sync

      - name: Run linting
        working-directory: backend
        run: |
          uv run black --check src tests
          uv run ruff check src tests

      - name: Run tests
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://parent_med_user:test_password@localhost:5432/parent_med_test
          JWT_SECRET: test_secret_key_for_ci
        run: |
          if [ "$(find tests -name '*.py' 2>/dev/null | wc -l)" -gt 0 ]; then
            uv run pytest -v
          else
            echo "No tests found, skipping..."
          fi

  # ========== Frontend (только сборка) ==========
  frontend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        run: npm run build

      - name: Run frontend tests
        working-directory: frontend
        run: npm run test

  # ========== Mobile ==========
  mobile:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        working-directory: mobile
        run: npm ci

      - name: Run typecheck
        working-directory: mobile
        run: npm run typecheck

      - name: Run mobile tests
        working-directory: mobile
        run: npm run test -- --runInBand

  # ========== Docker ==========
  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend, mobile]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker images
        run: docker compose build --no-cache

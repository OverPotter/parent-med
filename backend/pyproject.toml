[project]
name = "pillpath-backend"
version = "0.1.0"
description = "Backend: умная аптечка и ведение болезни ребёнка (MVP)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.30.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "alembic>=1.14.0",
    "cryptography>=44.0.0",
    "httpx[http2]>=0.28.0",
    "pywebpush>=2.0.3",
    "loguru>=0.7.3",
]

[project.optional-dependencies]
dev = [
    "black>=24.0",
    "ruff>=0.8",
]

[dependency-groups]
dev = [
    "black>=24.0",
    "ruff>=0.8",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
exclude = ["alembic"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["N818"]

[tool.ruff.lint.per-file-ignores]
# SQLAlchemy relationship(): forward refs в Mapped["ModelName"]
"src/infrastructure/database/models/*.py" = ["F821", "UP037"]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
